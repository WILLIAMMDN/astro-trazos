<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astro-Trazos: Geometría en Movimiento</title>
  <style>
    @font-face { font-family: 'Fredoka'; src: url('/assets/fonts/fredoka-latin-500-normal.woff2') format('woff2'); font-style: normal; font-weight: 500; font-display: swap; }
    @font-face { font-family: 'Fredoka'; src: url('/assets/fonts/fredoka-latin-600-normal.woff2') format('woff2'); font-style: normal; font-weight: 600; font-display: swap; }
    @font-face { font-family: 'Fredoka'; src: url('/assets/fonts/fredoka-latin-700-normal.woff2') format('woff2'); font-style: normal; font-weight: 700; font-display: swap; }
    @font-face { font-family: 'Nunito'; src: url('/assets/fonts/nunito-latin-600-normal.woff2') format('woff2'); font-style: normal; font-weight: 600; font-display: swap; }
    @font-face { font-family: 'Nunito'; src: url('/assets/fonts/nunito-latin-700-normal.woff2') format('woff2'); font-style: normal; font-weight: 700; font-display: swap; }
    @font-face { font-family: 'Nunito'; src: url('/assets/fonts/nunito-latin-800-normal.woff2') format('woff2'); font-style: normal; font-weight: 800; font-display: swap; }
    @font-face { font-family: 'Nunito'; src: url('/assets/fonts/nunito-latin-900-normal.woff2') format('woff2'); font-style: normal; font-weight: 900; font-display: swap; }
    @font-face { font-family: 'Patrick Hand'; src: url('/assets/fonts/patrick-hand-latin-400-normal.woff2') format('woff2'); font-style: normal; font-weight: 400; font-display: swap; }
    :root {
      --font-display: 'Fredoka', sans-serif;
      --font-ui: 'Nunito', sans-serif;
      --font-hand: 'Patrick Hand', cursive;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #04060e;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: var(--font-ui);
    }

    /* Escenario 16:9 exacto adaptable a cualquier pantalla */
    .stage-wrapper {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      max-width: 177.78vh;
      background: #080b1a;
      overflow: hidden;
      box-shadow: 0 30px 95px rgba(0, 0, 0, 0.95);
    }

    #space-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .screen-layer > svg {
      position: relative;
      z-index: 1;
    }

    .screen-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .screen-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.03);
    }

    .screen-active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
    }

    /* Interacciones de botones y tarjetas */
    .hud-btn, .menu-btn, .level-card, .ship-part {
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease;
      transform-box: fill-box;
      transform-origin: center;
    }
    .hud-btn:hover, .menu-btn:hover {
      filter: brightness(1.08) drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
    }
    .hud-btn:active, .menu-btn:active {
      filter: brightness(1.18);
    }

    .level-card:hover {
      filter: brightness(1.06) drop-shadow(0 10px 16px rgba(0, 0, 0, 0.45));
    }
    .level-card:active {
      filter: brightness(1.12);
    }

    .ship-part:hover {
      transform: translateY(-4px) scale(1.04);
      filter: brightness(1.1) drop-shadow(0 0 12px rgba(99, 210, 255, 0.55));
    }

    .neon-node, .poly-vertex, .drag-handle {
      cursor: grab;
      transition: filter 0.15s ease, transform 0.15s ease;
      transform-box: fill-box;
      transform-origin: center;
    }
    .neon-node:hover, .poly-vertex:hover, .drag-handle:hover {
      filter: brightness(1.3) drop-shadow(0 0 10px #00ffff);
      transform: scale(1.18);
    }
    .neon-node:active, .poly-vertex:active, .drag-handle:active {
      cursor: grabbing;
    }

    /* Animaciones continuas */
    @keyframes sawSpinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes portalSwirl {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes floatSoft {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pulseHighlight {
      0%, 100% { filter: drop-shadow(0 0 0px rgba(255, 215, 0, 0)); }
      50% { filter: drop-shadow(0 0 22px rgba(255, 215, 0, 0.95)); }
    }

    .portal-vortex {
      transform-origin: 1798px 576px;
      animation: portalSwirl 14s linear infinite;
    }
    .saw-spin-1 {
      transform-origin: 1368px 282px;
      animation: sawSpinSlow 18s linear infinite;
    }
    .saw-spin-2 {
      transform-origin: 1595px 400px;
      animation: sawSpinSlow 16s linear infinite;
    }
    .float-slow {
      animation: floatSoft 4.2s ease-in-out infinite;
    }
    .pulse-levels {
      animation: pulseHighlight 1.1s ease-in-out 2;
    }

    /* Barra flotante de cambio rápido de vista SIEMPRE VISIBLE */
    .quick-switcher {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 45;
      opacity: 0.94;
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-width: 98vw;
      overflow-x: auto;
    }
    .quick-switcher:hover {
      opacity: 1;
    }

    /* Cortina de transición espacial */
    #warp-curtain {
      position: absolute;
      inset: 0;
      z-index: 35;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at center, rgba(34, 229, 255, 0.35) 0%, rgba(10, 15, 36, 0.96) 70%);
      transition: opacity 0.28s ease;
    }

    #brush-status {
      position: absolute;
      z-index: 12;
      left: 2%;
      bottom: 2.4%;
      transform: none;
      width: min(550px, 38%);
      padding: 9px 18px 10px;
      color: #182744;
      background: #f3e4ca;
      border: 3px solid #594632;
      border-radius: 12px 9px 13px 7px;
      box-shadow: 0 9px 0 #2c3151, 0 15px 25px #050e2d99;
      font-family: var(--font-ui);
      text-align: center;
      pointer-events: none;
    }
    #brush-status[hidden] { display: none; }
    .brush-title { display: none; font-family: var(--font-display); font-size: clamp(12px, 1.5vw, 25px); font-weight: 700; }
    .brush-feedback { font-size: clamp(10px, 1.03vw, 17px); font-weight: 800; line-height: 1.2; }
    .brush-ink { display: none; font-size: clamp(10px, .9vw, 15px); font-weight: 900; color: #09688c; }
    .mission-ui[hidden] { display: none !important; }
    #mission-header {
      position: absolute; z-index: 13; top: 2%; left: 18%; width: 56%;
      min-height: 82px; padding: 13px 23px 14px 31px;
      color: #152347; background: #f6e9d4f5;
      clip-path: polygon(1% 5%, 4% 1%, 97% 2%, 100% 9%, 99% 93%, 96% 98%, 2% 99%, 0 91%);
      box-shadow: 0 13px 25px #030c2da6; pointer-events: none;
      font-family: var(--font-ui);
    }
    #mission-header::before { content: ''; position: absolute; left: 18px; top: 15px; bottom: 15px; width: 3px; background: #af8b67; }
    #mission-kicker { color: #075a83; font: 900 clamp(11px, 1.05vw, 18px) var(--font-ui); text-transform: uppercase; letter-spacing: .06em; }
    #mission-title { margin: 1px 0 2px; font: 900 clamp(17px, 1.8vw, 31px) var(--font-display); line-height: 1; }
    #mission-goal { font: 800 clamp(11px, 1.08vw, 19px) var(--font-ui); line-height: 1.15; }
    #mission-ink {
      position: absolute; z-index: 13; top: 2%; right: 2%; width: 19%;
      box-sizing: border-box; min-height: 87px; padding: 13px 18px 15px;
      color: #132648; background: #f5e6c9f6; border: 3px solid #5e4a36;
      border-radius: 13px 10px 15px 9px; box-shadow: 0 8px 0 #333353, 0 14px 28px #0008;
      font: 900 clamp(11px, 1.2vw, 20px) var(--font-ui); pointer-events: none;
    }
    .mission-ink-row { display: flex; align-items: center; gap: 7px; }
    .mission-drop { width: 28px; height: 32px; flex: none; fill: #142951; }
    #mission-ink-pct { margin-left: auto; font-family: var(--font-display); }
    .mission-ink-track { height: clamp(12px, 1.2vw, 20px); margin: 6px 0 0 29px; overflow: hidden; border: 3px solid #132747; border-radius: 999px; background: #2f344c; box-shadow: inset 0 2px 4px #0008; }
    #mission-ink-fill { height: 100%; width: 100%; border-radius: inherit; background: linear-gradient(90deg, #1784f2 0%, #6265df 42%, #a264db 65%, #43dcf3 100%); box-shadow: inset 0 2px #ffffff79; transition: width .16s linear; }
    #mission-guide {
      position: absolute; z-index: 13; top: 17%; left: 2%; width: 23%;
      box-sizing: border-box; padding: 15px 19px 17px; color: #1b294b;
      background: #f6e7cced; border: 3px solid #725942; border-radius: 11px 15px 10px 13px;
      box-shadow: 0 8px 0 #2b2c52, 0 14px 27px #0007;
      font: 800 clamp(11px, 1.05vw, 18px) var(--font-ui); line-height: 1.24;
      pointer-events: none;
    }
    #mission-guide strong { display: block; margin-bottom: 7px; color: #075b8e; font: 900 clamp(13px, 1.3vw, 23px) var(--font-display); }
    #mission-guide ol { margin: 0; padding-left: 22px; }
    #mission-guide li + li { margin-top: 4px; }
    #mission-hint { pointer-events: auto; width: 100%; margin-top: 11px; padding: 8px 10px;
      border: 2px solid #496a8c; border-radius: 9px; background: #d8eef5; color: #123e61;
      box-shadow: 0 3px 0 #7487a1; font: 900 clamp(11px, 1vw, 17px) var(--font-ui); cursor: pointer; }
    #mission-hint:hover, #mission-hint:focus-visible { background: #fff1bb; outline: 2px solid #173e63; }
    #mission-hint-detail { margin: 10px 0 0; padding-top: 8px; border-top: 2px dashed #7b8da0; }
    #mission-hint-detail[hidden] { display: none; }
    #game-stage[data-screen="salto"] #mission-guide { top: 47%; }
    #mission-actions { position: absolute; z-index: 14; right: 2%; bottom: 2.4%; display: flex; gap: 8px; }
    #mission-actions button { min-width: 94px; padding: 9px 12px; border: 3px solid #e8f6ff; border-radius: 10px; background: #111a34ec; color: #fff4d7; box-shadow: 0 6px 0 #050e24, 0 9px 18px #0008; font: 900 clamp(11px, 1vw, 17px) var(--font-ui); cursor: pointer; }
    #mission-actions #mission-play { background: #a2d792; color: #163526; border-color: #fff9e9; }
    #mission-actions button:hover, #mission-actions button:focus-visible { transform: translateY(-3px); box-shadow: 0 9px 0 #050e24, 0 13px 22px #0009; }
    #mission-actions button:active { transform: translateY(3px); box-shadow: 0 2px 0 #050e24; }
    #mission-result {
      position: absolute; inset: 0; z-index: 39; display: grid; place-items: center;
      padding: 24px; background: #07132bc9; backdrop-filter: blur(7px);
    }
    #mission-result[hidden] { display: none; }
    #mission-result-card {
      width: min(650px, 88%); padding: 27px 32px 30px;
      color: #182847; background: #f6e7c9;
      border: 5px solid #67513a; border-radius: 18px 13px 19px 12px;
      box-shadow: 0 12px 0 #292e50, 0 25px 75px #000a;
      font-family: var(--font-ui); text-align: center;
    }
    #mission-result-star { font-size: clamp(30px, 4vw, 60px); color: #f5b82e; text-shadow: 0 3px #754421; line-height: 1; }
    #mission-result-title { margin: 7px 0 8px; font: 900 clamp(25px, 3vw, 45px) var(--font-display); }
    #mission-result-explanation { margin: 0 0 16px; font: 800 clamp(15px, 1.3vw, 21px) var(--font-ui); line-height: 1.3; }
    #mission-result-math { padding: 12px 15px; border: 2px solid #4595bb; border-radius: 11px; background: #d9f5fa; color: #124a6b; font: 900 clamp(14px, 1.18vw, 20px) var(--font-ui); }
    #mission-result-next { min-width: 220px; margin-top: 20px; padding: 11px 20px; border: 3px solid #fff9e9; border-radius: 11px; background: #94cf89; color: #183620; box-shadow: 0 6px 0 #305340; font: 900 19px var(--font-ui); cursor: pointer; }
    #mission-result-next:hover, #mission-result-next:focus-visible { transform: translateY(-3px); box-shadow: 0 9px 0 #305340; }
    @media (max-width: 850px) {
      #mission-header { left: 12%; width: 65%; min-height: 0; padding: 8px 10px 9px 19px; }
      #mission-ink { width: 22%; min-height: 0; padding: 8px; }
      .mission-drop { width: 16px; height: 20px; }
      .mission-ink-track { margin-left: 0; }
      #mission-guide { width: 28%; top: 14%; padding: 9px; }
      #mission-actions button { min-width: 0; padding: 6px 7px; }
    }
    .guide-dot { filter: drop-shadow(0 0 10px #ffd665); }
    .route-danger-ring { animation: route-danger 1.4s ease-in-out infinite alternate; }
    #route-hazard.route-crash { animation: route-crash .18s linear 4 alternate; filter: drop-shadow(0 0 28px #ff4f62); }
    .route-elbow { filter: drop-shadow(0 0 9px #ffe77a); }
    @keyframes route-danger { from { opacity: .55; stroke-dashoffset: 0; } to { opacity: 1; stroke-dashoffset: -27; } }
    @keyframes route-crash { from { transform: translateX(-8px); } to { transform: translateX(8px); } }
    #screen-menu, #screen-level1, #screen-level2, #screen-salto,
    #screen-level3, #screen-level4, #screen-level5, #screen-level6 {
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }
    #screen-menu { background-image: url('/assets/menu-referencia.png'); }
    #screen-level1 { background-image: url('/assets/despegue-papel-sin-nilo.png'); }
    #screen-level2 { background-image: url('/assets/vector-desierto-sin-nilo.png'); }
    #screen-salto { background-image: url('/assets/salto-vacio.png'); }
    #screen-level3 { background-image: url('/assets/peso-vacio.png'); }
    #screen-level4 { background-image: url('/assets/rayos-vacio.png'); }
    #screen-level5 { background-image: url('/assets/escudo-hexagono-sin-nilo.png'); }
    #screen-level6 { background-image: url('/assets/nucleo-cosmico-sin-nilo.png'); }
    #screen-menu #menu-svg { opacity: 0; pointer-events: none; }
    .menu-hit {
      position: absolute;
      z-index: 8;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: transparent;
      cursor: pointer;
    }
    .menu-hit:hover, .menu-hit:focus-visible {
      outline: 3px solid #ffdf69;
      outline-offset: 2px;
      background: #fff7c715;
    }
    .menu-lock {
      position: absolute;
      top: 72.8%;
      width: 11.7%;
      height: 21.5%;
      border-radius: 8px;
      background: #14203e9e;
      border: 2px solid #b8c0cc88;
      box-shadow: inset 0 0 18px #111b38;
      color: #fff4d7;
      font-family: var(--font-display);
      font-size: clamp(13px, 2.4vw, 36px);
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    .menu-sixth-card { position: absolute; z-index: 5; left: 64.4%; top: 72.8%; width: 11.7%; height: 21.5%;
      box-sizing: border-box; padding: .45% .45% .35%; display: flex; flex-direction: column; align-items: center;
      border: 5px solid #f9efdd; border-radius: 8px; background: #f9efdd; color: #15294a;
      box-shadow: 0 4px 0 #b8a385, 0 8px 13px #0913298c; pointer-events: none;
      font-family: var(--font-ui); text-align: center; }
    .menu-sixth-thumb { width: 100%; height: 64%; flex: none; border-radius: 4px;
      background: #192951 url('/assets/nucleo-cosmico-sin-nilo.png') center / cover no-repeat; }
    .menu-sixth-stars { height: 13%; color: #cc9d31; line-height: 1; font-size: clamp(13px, 1.55vw, 27px); }
    .menu-sixth-card strong { line-height: 1; font-size: clamp(12px, 1.2vw, 22px); }
    .menu-sixth-card span { line-height: 1.05; font-size: clamp(9px, .95vw, 18px); }
    #level-picker { position: absolute; z-index: 40; inset: 0; display: grid; place-items: center;
      padding: 16px; background: #050b1bc9; backdrop-filter: blur(5px); }
    #level-picker.hidden { display: none; }
    .level-picker-card { width: min(680px, 92%); max-height: 90%; overflow: auto; box-sizing: border-box;
      padding: 22px 26px; border: 5px solid #7b5d3e; border-radius: 15px; background: #f5e6ca;
      box-shadow: 0 15px 0 #28304d, 0 28px 70px #000b; color: #1a2e50; text-align: center; }
    .level-picker-card h2 { margin: 0 0 4px; font: 900 clamp(24px, 3vw, 42px) var(--font-display); }
    .level-picker-card p { margin: 0 0 18px; font: 800 clamp(14px, 1.2vw, 19px) var(--font-ui); }
    #level-picker-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    #level-picker-list button, #level-picker-close { padding: 10px 12px; border: 3px solid #fdf7e9;
      border-radius: 10px; background: #dbeef3; color: #123c59; box-shadow: 0 4px 0 #507088;
      font: 900 clamp(12px, 1.2vw, 18px) var(--font-ui); cursor: pointer; }
    #level-picker-list button:hover, #level-picker-list button:focus-visible { background: #fff1ad; }
    #level-picker-close { width: min(240px, 100%); margin-top: 18px; background: #a3d396; color: #173b26; box-shadow: 0 4px 0 #536e49; }
    #screen-level1 svg, #screen-level2 svg, #screen-salto svg,
    #screen-level3 svg, #screen-level4 svg, #screen-level5 svg,
    #screen-level6 svg { cursor: crosshair; }
    .quick-switcher {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      background: #0b1124ee;
      border: 2px solid #38bdf899;
      border-radius: 999px;
      box-shadow: 0 12px 30px #0009;
    }
    .quick-switcher button {
      flex: none;
      padding: 5px 9px;
      border: 0;
      border-radius: 999px;
      background: #17263e;
      color: #e8f6ff;
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }
    #pause-modal, #victory-modal, #options-modal {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #050b1bc9;
      backdrop-filter: blur(5px);
    }
    #pause-modal.hidden, #victory-modal.hidden, #options-modal.hidden { display: none; }
    #pause-modal > div, #victory-modal > div, #options-modal > div {
      width: min(450px, 90%);
      padding: 24px;
      background: #f4e3c9;
      border: 4px solid #8b6843;
      border-radius: 16px;
      box-shadow: 0 24px 75px #000b;
      color: #241a10;
      text-align: center;
    }
    #pause-modal h2, #victory-modal h2, #options-modal h2 { margin: 0 0 7px; font: 700 30px var(--font-display); }
    #pause-modal p, #victory-modal p, #options-modal p { margin: 0 0 22px; font-weight: 800; }
    #pause-modal button, #victory-modal button, #options-modal button {
      width: 100%;
      margin-top: 9px;
      padding: 12px;
      border: 2px solid #536f42;
      border-radius: 11px;
      background: #94ca80;
      color: #172b14;
      font: 900 17px var(--font-ui);
      cursor: pointer;
    }
    #pause-modal button:nth-child(2), #victory-modal button:first-child { background: #a0aaf0; border-color: #4d579b; color: #151b4b; }
    #pause-modal button:nth-child(3) { background: #e9958d; border-color: #934b42; color: #441512; }
    #options-modal button:first-child { background: #e9a491; border-color: #985340; color: #421a10; }
    #toast-msg {
      position: absolute;
      z-index: 50;
      top: 13.5%;
      left: 50%;
      transform: translate(-50%, -8px);
      width: max-content;
      max-width: min(480px, 70%);
      padding: 10px 16px;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      background: #141b2df2;
      box-shadow: 0 14px 32px #0008;
      color: #fff;
      font-size: clamp(11px, 1.2vw, 17px);
      font-weight: 900;
      line-height: 1.25;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    #toast-msg.opacity-100 { opacity: 1; transform: translate(-50%, 0); }
    #toast-msg.opacity-0 { opacity: 0; }
    #toast-msg span:first-child {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 8px;
      border-radius: 50%;
      background: #22e5ff;
      box-shadow: 0 0 9px #22e5ff;
    }
    .nilo-hero { filter: drop-shadow(0 9px 4px #0712247a); }
    .nilo-body { transform-origin: center bottom; }
    .nilo-hero[data-pose="idle"] .nilo-body { animation: nilo-breathe 2.1s ease-in-out infinite; }
    .nilo-hero[data-pose="walk"] .nilo-body { animation: nilo-stride .28s ease-in-out infinite alternate; }
    .nilo-hero[data-pose="jump"] .nilo-body { animation: nilo-jump .65s ease-in-out infinite alternate; }
    .nilo-hero[data-pose="build"] .nilo-body { animation: nilo-build .35s ease-in-out infinite alternate; }
    .nilo-hero[data-pose="cheer"] .nilo-body { animation: nilo-cheer .42s ease-in-out infinite alternate; }
    .nilo-shadow { animation: nilo-shadow 2.1s ease-in-out infinite; pointer-events: none; }
    .construction-solid { animation: construction-appear .26s ease-out both; }
    .construction-preview { opacity: .78; filter: drop-shadow(0 0 12px #56e9ff); }
    .laser-hot { animation: laser-pulse 1.2s ease-in-out infinite alternate; }
    .laser-stream { animation: laser-flow .5s linear infinite; }
    .emitter-core, .laser-spark { animation: emitter-pulse .7s ease-in-out infinite alternate; }
    #sawBlade1 .saw-spin-1 { transform-box: fill-box; transform-origin: center; animation: saw-spin 3.5s linear infinite; }
    #sawBlade2 .saw-spin-2 { transform-box: fill-box; transform-origin: center; animation: saw-spin 4.1s linear infinite reverse; }
    #exitPortal .portal-vortex { animation: portal-breathe 2.3s ease-in-out infinite alternate; }
    #collectibleShipPiece { animation: portal-breathe 1.7s ease-in-out infinite alternate; }
    @keyframes nilo-breathe { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-5px) rotate(1deg); } }
    @keyframes nilo-stride { from { transform: translateY(0) rotate(-3deg) scaleY(.98); } to { transform: translateY(-7px) rotate(3deg) scaleY(1.02); } }
    @keyframes nilo-jump { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-14px) rotate(6deg); } }
    @keyframes nilo-build { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    @keyframes nilo-cheer { from { transform: translateY(0) rotate(-5deg); } to { transform: translateY(-12px) rotate(5deg); } }
    @keyframes nilo-shadow { 0%, 100% { opacity: .42; } 50% { opacity: .3; } }
    @keyframes construction-appear { from { opacity: 0; } to { opacity: 1; } }
    @keyframes laser-pulse { from { opacity: .65; stroke-width: 9px; } to { opacity: 1; stroke-width: 13px; } }
    @keyframes laser-flow { to { stroke-dashoffset: -27; } }
    @keyframes emitter-pulse { from { opacity: .5; } to { opacity: 1; } }
    @keyframes saw-spin { to { transform: rotate(360deg); } }
    @keyframes portal-breathe { from { opacity: .75; filter: brightness(1); } to { opacity: 1; filter: brightness(1.35); } }
    @media (prefers-reduced-motion: reduce) {
      .nilo-body, .nilo-shadow, .construction-solid, .laser-hot, .laser-stream, .route-danger-ring,
      .emitter-core, .laser-spark, #sawBlade1 .saw-spin-1,
      #sawBlade2 .saw-spin-2, #exitPortal .portal-vortex,
      #collectibleShipPiece { animation: none; }
    }
  </style>
</head>
